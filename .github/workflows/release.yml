name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # OIDC token for `npm publish --provenance`

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # third-party actions are pinned to commit SHAs (tags are mutable)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::warning::NPM_TOKEN secret not set — skipping npm publish. Add the secret (Settings → Secrets → Actions) to enable automatic publishing.'
            exit 0
          fi
          npm publish --provenance
      - name: Extract release notes for this version
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          # the "## <version>" section of CHANGELOG.md, up to the next "## " heading
          awk -v want="## ${version}" '
            index($0, "## ") == 1 { if (found) exit; if ($0 == want) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no '## ${version}' section (or it is empty)"
            exit 1
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"
      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
