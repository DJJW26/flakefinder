name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag and notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Check tag ancestry, version and changelog
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::The release commit must be on the default branch."
            exit 1
          fi
          node scripts/release.mjs --validate-tag "$TAG"

  verify:
    needs: validate
    uses: ./.github/workflows/verify.yml

  publish:
    name: Publish the tested npm package
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require a completed verification
        env:
          VERIFIED: ${{ needs.verify.outputs.verified }}
        run: test "$VERIFIED" = true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/package
          merge-multiple: true
      - name: Verify SHA-256 and publish with provenance
        env:
          TAG: ${{ github.ref_name }}
          SHA256: ${{ needs.verify.outputs.sha256 }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          : "${NODE_AUTH_TOKEN:?The repository NPM_TOKEN secret is required to publish}"
          tarball="$RUNNER_TEMP/package/flakefinder.tgz"
          echo "$SHA256  $tarball" | sha256sum --check --strict
          dist_tag=latest
          if [[ "${TAG%%+*}" == *-* ]]; then dist_tag=next; fi
          npm publish "$tarball" --tag "$dist_tag" --provenance

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Create release from the validated changelog
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          node scripts/release.mjs --validate-tag "$TAG" > "$notes"
          flags=()
          if [[ "${TAG%%+*}" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" --verify-tag --generate-notes --notes-file "$notes" "${flags[@]}"
