name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome check src tests
      - run: npx tsc -p .
      - run: npx vitest run
      - name: coverage gate (engine/parsers/store ≥85% lines)
        run: npx vitest run --coverage
      - run: npm run build
      - name: performance smoke (150k observations)
        run: node scripts/perf-smoke.mjs
      - name: dist is committed and up to date
        run: |
          git diff --exit-code dist/ || (echo '::error::dist/ is stale — run "npm run build" and commit' && exit 1)

  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest 5 supports Node 22.12+ and Node 24.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - run: node dist/cli.js version

  node-18-runtime:
    # Build with the dev toolchain, then install and run the published CLI on Node 18.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack the CLI
        run: |
          PACK=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          echo "CLI_TARBALL=$RUNNER_TEMP/$PACK" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18
      - name: CLI smoke (ingest → report → html)
        shell: bash
        run: |
          cd "$(mktemp -d)"
          npm install --prefix "$PWD" --engine-strict --no-audit --no-fund "$CLI_TARBALL"
          FIXTURES="$GITHUB_WORKSPACE/tests/parsers-fixtures"
          cp "$FIXTURES/jest.json" "$FIXTURES/junit-pytest.xml" .
          CLI=./node_modules/.bin/flakefinder
          "$CLI" version
          "$CLI" ingest jest.json junit-pytest.xml
          REPORT=$("$CLI" report --no-color)
          grep -q "tracked test" <<< "$REPORT"
          "$CLI" html
          test -s flakefinder-report.html
          echo "node-18 runtime smoke OK"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache jest fixture deps
        uses: actions/cache@v4
        with:
          path: fixtures/jest-project/node_modules
          key: jest-fixture-${{ hashFiles('fixtures/jest-project/package.json') }}
      - run: npm ci
      - run: npm run build
      - run: node scripts/e2e.mjs
