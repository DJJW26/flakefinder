name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# third-party actions are pinned to full commit SHAs (tags are mutable);
# checkout does not persist the token into .git/config

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx biome check src tests
      - run: npx tsc -p .
      - run: npx vitest run
      - name: coverage gate (engine/parsers/store ≥85% lines)
        run: npx vitest run --coverage
      - run: npm run build
      - name: performance smoke (150k observations)
        run: node scripts/perf-smoke.mjs
      - name: third-party notices are up to date
        run: node scripts/third-party-notices.mjs --check
      - name: dist is committed and up to date
        run: |
          git diff --exit-code dist/ || (echo '::error::dist/ is stale — run "npm run build" and commit' && exit 1)

  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest (dev toolchain) needs Node >= 20.19; Node 18 is covered by the runtime job below.
        # 24 is the Action runtime (action.yml `using: node24`).
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - run: node dist/cli.js version

  node-18-runtime:
    # The PUBLISHED CLI supports Node 18 (engines: >=18); exercise the built
    # artifact directly, without the dev toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js version
      - name: CLI smoke (ingest → report → html)
        run: |
          SMOKE=$(mktemp -d)
          cp tests/parsers-fixtures/jest.json "$SMOKE/"
          node dist/cli.js --cwd "$SMOKE" ingest jest.json
          node dist/cli.js --cwd "$SMOKE" report --no-color | grep -q "tracked test"
          node dist/cli.js --cwd "$SMOKE" html
          test -s "$SMOKE/flakefinder-report.html"
          echo "node-18 runtime smoke OK"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Cache jest fixture deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fixtures/jest-project/node_modules
          key: jest-fixture-${{ hashFiles('fixtures/jest-project/package.json') }}
      - run: npm ci
      - run: npm run build
      - run: node scripts/e2e.mjs
