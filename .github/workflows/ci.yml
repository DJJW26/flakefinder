name: ci

on:
  push:
    branches: [main, fix/windows-parity, codex/release-parity]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  required:
    name: Release parity
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs to pass
        env:
          RESULT: ${{ needs.verify.result }}
          VERIFIED: ${{ needs.verify.outputs.verified }}
        run: test "$RESULT" = success && test "$VERIFIED" = true
