name: Verify CLI

on:
  workflow_call:
    outputs:
      artifact_id:
        description: Artifact containing the verified npm tarball
        value: ${{ jobs.build.outputs.artifact_id }}
      sha256:
        description: SHA-256 of the original npm tarball
        value: ${{ jobs.build.outputs.sha256 }}
      verified:
        description: All required jobs passed
        value: ${{ jobs.result.outputs.verified }}

permissions:
  contents: read

jobs:
  build:
    name: Build and pack (Ubuntu, Node 24)
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Verify committed bundles match the build
        run: |
          git diff --exit-code HEAD -- dist/
          test -z "$(git ls-files --others --exclude-standard -- dist/)"
      - run: npm run perf
      - run: node scripts/third-party-notices.mjs --check
      - name: Pack once and record the tarball digest
        id: pack
        run: |
          filename=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          mkdir "$RUNNER_TEMP/package"
          mv "$RUNNER_TEMP/$filename" "$RUNNER_TEMP/package/flakefinder.tgz"
          digest=$(sha256sum "$RUNNER_TEMP/package/flakefinder.tgz")
          echo "sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flakefinder-npm-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package/flakefinder.tgz
          if-no-files-found: error
          compression-level: 0

  source:
    name: Source (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
            e2e: true
          - os: ubuntu-latest
            node: '26'
            e2e: false
          - os: windows-latest
            node: '24'
            e2e: true
          - os: macos-latest
            node: '24'
            e2e: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Run the committed Action against a JUnit report
        if: matrix.e2e
        uses: ./
        id: action-smoke
        with:
          working-directory: tests/parsers-fixtures
          reports: junit-node-test.xml
          comment: 'false'
          upload-dashboard: 'false'
          fail-on-new-flakes: 'true'
      - name: Check the Action outputs
        if: matrix.e2e
        env:
          REPORT: ${{ steps.action-smoke.outputs.report-json }}
          FAILING: ${{ steps.action-smoke.outputs.failing-count }}
        run: node -e "const r = JSON.parse(require('node:fs').readFileSync(process.env.REPORT, 'utf8')); require('node:assert/strict').ok(Number(process.env.FAILING) > 0 && r.verdicts.some(v => v.name === 'fails'))"
      - run: npm ci
      - run: npm test
      - if: matrix.e2e
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: fixtures/go-project/go.mod
          cache: false
      - if: matrix.e2e
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - if: matrix.e2e
        run: python -m pip install -r fixtures/pytest-project/requirements.txt
      - name: Real Jest, pytest and Go fixtures with the committed CLI
        if: matrix.e2e
        env:
          FF_E2E_NOBUILD: '1'
          FF_E2E_STRICT: '1'
        run: npm run e2e

  packed:
    name: Installed CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/package
          merge-multiple: true
      - name: Install and exercise the verified tarball
        shell: bash
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: node scripts/packed-smoke.mjs "$RUNNER_TEMP/package/flakefinder.tgz" "$SHA256"

  result:
    name: Verification result
    if: always()
    needs: [build, source, packed]
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - id: check
        env:
          BUILD: ${{ needs.build.result }}
          SOURCE: ${{ needs.source.result }}
          PACKED: ${{ needs.packed.result }}
        run: |
          test "$BUILD" = success
          test "$SOURCE" = success
          test "$PACKED" = success
          echo "verified=true" >> "$GITHUB_OUTPUT"
